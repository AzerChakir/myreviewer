# Runs on the Azure VM. The app container binds to localhost only; the host's
# nginx terminates TLS and is the single public entry point for both the
# dashboard and the GitHub App webhook.
#
#   public https://<your-domain>/webhook
#        -> nginx :443 (TLS, Let's Encrypt)
#        -> container :8000 (uvicorn)
#
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pr-decomposer:latest
    container_name: pr-decomposer
    restart: unless-stopped
    # env_file keeps secrets out of the compose file itself.
    env_file:
      - .env
    environment:
      # Container-internal path for the persistent volume.
      DATA_DIR: /app/data
    ports:
      # Bound to loopback on purpose: nginx is the only public listener.
      - "127.0.0.1:8000:8000"
    volumes:
      # Named volume so installations/tokens/reports survive rebuilds.
      - pr-decomposer-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pr-decomposer-data:
