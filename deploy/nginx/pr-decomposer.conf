# Host nginx on the Azure VM: the only public listener.
# Install: sudo cp deploy/nginx/pr-decomposer.conf /etc/nginx/sites-available/pr-decomposer
#          sudo ln -s /etc/nginx/sites-available/pr-decomposer /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate (requires the DNS A record for <your-domain>
# to already point at this VM's public IP):
#          sudo certbot --nginx -d <your-domain>
#
# GitHub requires a publicly trusted TLS certificate for webhooks, so the
# self-signed localhost cert is only good for local testing.

upstream pr_decomposer {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;

    # certbot rewrites this block to redirect to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <your-domain>;

    # ssl_certificate paths are written by `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # GitHub webhook payloads can be large; report PDFs are generated server-side.
    client_max_body_size 25m;

    # Webhook delivery must not be buffered or timed out by nginx, otherwise
    # GitHub records a delivery failure even though the app processed the event.
    location /webhook {
        proxy_pass         http://pr_decomposer;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # Same treatment for the App health probe used by uptime checks.
    location /health {
        proxy_pass       http://pr_decomposer;
        proxy_set_header Host $host;
    }

    # Everything else: Angular bundle + REST API.
    location / {
        proxy_pass         http://pr_decomposer;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # Light hardening for the static bundle.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        proxy_pass       http://pr_decomposer;
        proxy_set_header Host $host;
        expires         7d;
        add_header       Cache-Control "public, immutable";
    }
}
