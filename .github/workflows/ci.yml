name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reused as a deployment gate by deploy.yml.
  workflow_call:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: prototype

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check
        run: python -m compileall -q github_app pr_decomposer github_client.py api.py

      - name: Run test suite
        # The live test hits a real NIM endpoint; it is skipped unless secrets are set.
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototype/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npx ng build --configuration production

      - name: Verify bundle was emitted
        run: test -f dist/dashboard/browser/index.html

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          push: false
          load: true
          tags: pr-decomposer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run -d --name pr-ci -p 8000:8000 pr-decomposer:ci
          # Give uvicorn a moment to bind.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API healthy"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          echo
          # The dashboard must be served by the same process (single-service mode).
          curl -fsS http://127.0.0.1:8000/ | grep -q "<app-root>" \
            && echo "Dashboard served from same process: OK"
          # A webhook without a valid signature must be rejected.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" -d '{}' http://127.0.0.1:8000/webhook)
          echo "unsigned webhook -> $code (expect 401)"
          test "$code" = "401"
