name: Publish to Docker Hub

# Publishes the image to Docker Hub. The Azure VM does NOT get pushed to from
# here - it pulls. That keeps no SSH key in GitHub Secrets and means you can
# update the VM on your own schedule with deploy/deploy_vm.sh.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-dockerhub
  cancel-in-progress: false

jobs:
  # Never publish an image that does not pass tests.
  # A job that calls a reusable workflow may only declare name/uses/with/
  # secrets/needs/if - no runs-on and no steps. Declaring either makes GitHub
  # reject the whole workflow file, so this job fails at load time, not run time.
  gate:
    name: Require passing CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push image
    needs: gate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pr-decomposer
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "image=${IMAGE}"
            # Built as one heredoc output so the tags list can never contain a
            # blank entry when REF_TYPE is not a tag.
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SHA}"
            echo "${IMAGE}:${SHA::7}"
            if [ "${REF_TYPE}" = "tag" ]; then
              echo "${IMAGE}:${REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        if: steps.meta.outputs.image == '/pr-decomposer'
        run: |
          echo "::error::DOCKERHUB_USERNAME is not set. Add it under" \
            "Settings -> Secrets and variables -> Actions." >&2
          exit 1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Use an access token, not your account password:
        #   https://hub.docker.com/settings/tokens  (scope: read & write)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SHA: ${{ github.sha }}
        run: |
          echo "### Published to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`latest\` | \`${IMAGE}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`main\` (sha) | \`${IMAGE}:${SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`main\` (short) | \`${IMAGE}:${SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update the VM with \`/opt/pr-decomposer/prototype/deploy/deploy_vm.sh\`" \
            >> "$GITHUB_STEP_SUMMARY"
