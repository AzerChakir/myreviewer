name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test gate and deploy directly"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: prototype

jobs:
  # Deploy only from a green commit on main.
  gate:
    name: Require passing CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on this commit
        uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: gate
    if: ${{ !inputs.skip_tests || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          port: ${{ secrets.VM_SSH_PORT }}
          username: ${{ secrets.VM_SSH_USER }}
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Log in to GHCR from the VM
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart on the VM
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          APP_DIR: ${{ vars.VM_APP_DIR }}
        run: |
          cd "$APP_DIR"
          git fetch origin main && git checkout main && git pull origin main
          docker compose pull app
          IMAGE_TAG="$IMAGE" docker compose up -d --no-deps app
          docker image prune -f --filter "until=168h"
          docker compose ps

      - name: Health check the public URL
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$APP_DOMAIN/api/health"; then
              echo " -> healthy"
              exit 0
            fi
            echo "waiting for rollout ($i/30)..."
            sleep 5
          done
          echo "::error::Deployment did not become healthy"
          exit 1

      - name: Rollback on failed health check
        if: failure()
        env:
          APP_DIR: ${{ vars.VM_APP_DIR }}
        run: |
          cd "$APP_DIR"
          echo "::warning::Health check failed; re-pulling previous release"
          docker compose pull app || true
          docker compose up -d --no-deps app || true
          docker compose logs --tail 100 app
