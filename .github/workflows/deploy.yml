name: Publish to Docker Hub

# Publishes the image to Docker Hub. The Azure VM does NOT get pushed to from
# here - it pulls. That keeps no SSH key in GitHub Secrets and means you can
# update the VM on your own schedule with deploy/deploy_vm.sh.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-dockerhub
  cancel-in-progress: false

defaults:
  run:
    working-directory: prototype

jobs:
  # Never publish an image that does not pass tests.
  gate:
    name: Require passing CI
    runs-on: ubuntu-latest
    steps:
      - name: Run CI on this commit
        uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push image
    needs: gate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/pr-decomposer"
          {
            echo "image=${IMAGE}"
            echo "latest=${IMAGE}:latest"
            echo "sha=${IMAGE}:${{ github.sha }}"
            echo "short=${IMAGE}:${{ github.sha::7 }}"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "semver=${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Use an access token, not your account password:
        #   https://hub.docker.com/settings/tokens  (scope: read & write)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.latest }}
            ${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`latest\` | \`${{ steps.meta.outputs.latest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`main\` (sha) | \`${{ steps.meta.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update the VM with: \`/opt/pr-decomposer/prototype/deploy/deploy_vm.sh\`" \
            >> "$GITHUB_STEP_SUMMARY"
